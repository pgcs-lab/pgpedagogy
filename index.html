<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Apprenticeship Pedagogy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--brand:#0072f5;--ink:#f6f4ec;--muted:rgba(246,244,236,.62);--glass:rgba(7,18,12,.5);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1f3d2a;color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
#scene{position:fixed;inset:0}
#scene canvas{display:block;touch-action:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 115% 90% at 50% 42%,transparent 50%,rgba(3,10,6,.6) 100%)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

/* logo */
.logo{position:fixed;left:30px;top:26px;width:150px;color:#fff;filter:drop-shadow(0 2px 12px rgba(0,0,0,.35));z-index:2}
.logo svg,.mark svg{width:100%;height:auto;display:block}

/* hotspot labels: number only, name on hover or when chosen */
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;pointer-events:none;opacity:0;transition:opacity .35s}
.lbl.on{opacity:1;pointer-events:auto;cursor:pointer}
.lbl.on.behind{opacity:.22}
.lbl.peek{opacity:1}
.lbl .n{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:rgba(7,18,12,.72);border:1.5px solid var(--c);backdrop-filter:blur(4px)}
.lbl .t{font-size:13px;font-weight:600;white-space:nowrap;border-radius:999px;background:rgba(7,18,12,.75);backdrop-filter:blur(4px);max-width:0;overflow:hidden;opacity:0;padding:4px 0;transition:max-width .4s,opacity .25s,padding .4s}
.lbl:hover .t,.lbl.peek .t,.lbl.active .t{max-width:340px;opacity:1;padding:4px 11px}
.lbl.active .n{background:var(--c);color:#0b1610}

/* overview signs */
.sign{position:absolute;left:0;top:0;display:flex;align-items:center;pointer-events:none;opacity:0;transition:opacity .45s}
.sign.on{opacity:1;pointer-events:auto;cursor:pointer}
.sign .stem{width:40px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6))}
.sign .pill{display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:999px;background:rgba(7,18,12,.6);border:1px solid var(--line);backdrop-filter:blur(6px);font-weight:600;font-size:14px;transition:background .2s}
.sign .pill .n{width:24px;height:24px;border-radius:50%;background:var(--c);color:#0b1610;display:grid;place-items:center;font-size:12px;font-weight:800}
.sign:hover .pill{background:var(--brand);border-color:var(--brand)}

/* altitude rail */
#rail{position:fixed;right:30px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;z-index:2}
#rail::before{content:"";position:absolute;right:7.5px;top:22px;bottom:22px;width:1px;background:rgba(255,255,255,.28)}
.stop{position:relative;display:flex;align-items:center;gap:14px;height:46px}
.stop .nm{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:0;transform:translateX(8px);transition:.3s;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.7)}
.stop:hover .nm,.stop[aria-current="true"] .nm{opacity:1;transform:none}
.stop .d{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);background:#10241a;position:relative;transition:.3s}
.stop .d::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--c);opacity:.9}
.stop[aria-current="true"] .d{border-color:#fff;transform:scale(1.25);box-shadow:0 0 0 6px rgba(0,114,245,.35),0 0 18px rgba(0,114,245,.6)}
.stop[aria-current="true"] .d::after{background:var(--brand)}

/* the one card */
#card{position:fixed;left:30px;bottom:30px;width:min(440px,calc(100vw - 60px));max-height:calc(100vh - 140px);overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:24px 26px 22px;backdrop-filter:blur(20px) saturate(1.25);-webkit-backdrop-filter:blur(20px) saturate(1.25);box-shadow:0 30px 80px rgba(0,0,0,.35);transition:opacity .35s,transform .35s;z-index:2}
#card.swap{opacity:0;transform:translateY(12px)}
#card::-webkit-scrollbar{width:0}
.kick{display:flex;flex-wrap:wrap;row-gap:3px;align-items:center;gap:10px;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding-right:84px}
.kick i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:none}
#card h2{font-weight:800;font-size:30px;line-height:1.06;letter-spacing:-.025em;margin:12px 0 10px}
#card p{margin:0;font-size:15px;line-height:1.55;color:rgba(246,244,236,.82)}
.navbtns{position:absolute;top:18px;right:18px;display:flex;gap:6px}
.navbtns button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .2s}
.navbtns button:hover{background:rgba(255,255,255,.12)}
.navbtns svg{width:14px;height:14px}
.chips{display:flex;gap:7px;margin-top:18px;flex-wrap:wrap}
.chip{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);font-weight:700;font-size:13.5px;display:grid;place-items:center;transition:.2s}
.chip:hover{border-color:var(--c);transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#0b1610}
.more{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);animation:up .4s ease}
.more b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:5px}
.more .q{color:var(--c);font-weight:600;font-size:14px;margin-bottom:5px}
.more .d{font-size:14.5px;line-height:1.55;color:rgba(246,244,236,.8)}
.more .x{font-size:13.5px;line-height:1.5;color:var(--muted)}
.more .x b{display:inline;font-size:13.5px;color:var(--ink)}
.cta{margin-top:20px;display:inline-flex;align-items:center;gap:10px;background:var(--brand);color:#fff;font-weight:700;font-size:15px;padding:13px 20px;border-radius:999px;transition:transform .2s,box-shadow .2s;box-shadow:0 10px 30px rgba(0,114,245,.35)}
.cta:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,114,245,.5)}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:.04em;pointer-events:none;transition:opacity 1s;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.hint.gone{opacity:0}
#tour{position:fixed;right:30px;bottom:30px;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:700;font-size:14px;transition:background .25s,transform .2s,opacity .8s}
#tour:hover{transform:translateY(-2px)}
#tour .ic{width:28px;height:28px;border-radius:50%;background:var(--brand);display:grid;place-items:center}
#tour .ic svg{width:12px;height:12px;fill:#fff}
#tour[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}
#tour[aria-pressed="true"] .ic{background:rgba(255,255,255,.2)}
body.intro #tour{opacity:0;pointer-events:none}
.prog{position:sticky;bottom:-22px;margin:18px -26px -22px;height:3px;background:rgba(255,255,255,.08);overflow:hidden}
.prog span{display:block;height:100%;background:var(--brand);transform-origin:left;transform:scaleX(0);animation:prog linear forwards}
@keyframes prog{to{transform:scaleX(1)}}
#intro .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;animation:up 1s .45s ease both}
.ghost{margin-top:20px;display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:15px 24px;border-radius:999px;border:1.5px solid rgba(255,255,255,.55);transition:background .2s}
.ghost:hover{background:rgba(255,255,255,.1)}
#toast{position:fixed;left:50%;top:28px;transform:translate(-50%,-30px);opacity:0;transition:.4s;background:var(--brand);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:4}
#toast.show{opacity:1;transform:translate(-50%,0)}

#intro{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,rgba(6,16,10,.25),rgba(6,16,10,.82));transition:opacity .9s;z-index:5}
#intro.gone{opacity:0;pointer-events:none}
body.intro #card,body.intro #rail,body.intro .logo{opacity:0;pointer-events:none}
#card,#rail,.logo{transition:opacity .8s}
#intro .box{text-align:center;padding:24px;max-width:760px}
#intro .mark{width:min(300px,62vw);margin:0 auto 34px;color:#fff;animation:up 1s ease both}
#intro h1{font-weight:800;font-size:clamp(40px,7vw,78px);line-height:.98;letter-spacing:-.035em;margin:0 0 18px;animation:up 1s .15s ease both}
#intro .commit{font-size:clamp(14px,1.6vw,17px);color:var(--muted);margin:0 0 30px;animation:up 1s .3s ease both}
#intro .cta{font-size:16px;padding:15px 26px}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:#122a1c;z-index:9;transition:opacity .7s}
#loader.gone{opacity:0;pointer-events:none}
#loader .rings{display:flex}
#loader .rings span{width:34px;height:34px;border:3px solid #fff;border-radius:50%;animation:pulse 1.2s ease-in-out infinite}
#loader .rings span+span{margin-left:-17px;animation-delay:.2s}
@keyframes pulse{50%{opacity:.35;transform:scale(.9)}}
#err{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:30px;z-index:10;background:#122a1c}

@media (max-width:820px){
  #tour{right:12px;top:66px;bottom:auto;padding:6px;}
  #tour .tx{display:none}
  .logo{left:18px;top:18px;width:116px}
  #rail{right:12px;top:16px;transform:none;flex-direction:row;gap:2px}
  #rail::before{left:20px;right:20px;top:22px;bottom:auto;width:auto;height:1px}
  .stop{height:44px;width:30px;justify-content:center}.stop .nm{display:none}
  #card{left:12px;right:12px;bottom:12px;width:auto;max-height:46vh;padding:20px 20px 18px;border-radius:20px}
  #card h2{font-size:23px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</script>

</div>

/* seeded random so the forest is the same every visit */
let seed = 11;
const rnd = () => { seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
const R = (a,b) => a+(b-a)*rnd();

const mat = (c,o={}) => new THREE.MeshStandardMaterial({color:c, flatShading:true, roughness:.92, metalness:0, ...o});
const barkMat = mat(0x6e5038), barkDark = mat(0x4f3a29);

/* sky dome */
{

    uniforms:{ top:{value:new THREE.Color(0xf3e7a8)}, mid:{value:new THREE.Color(0x6f9a5c)}, bot:{value:FOG} },
    vertexShader:`varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`uniform vec3 top,mid,bot; varying vec3 vP; void main(){ float h=vP.y; vec3 c=mix(bot,mid,smoothstep(0.02,0.3,h)); c=mix(c,top,smoothstep(0.35,0.95,h)); gl_FragColor=vec4(c,1.0);} `});
  scene.add(new THREE.Mesh(g,m));
}

/* glow texture */
function glowTex(){ const c=document.createElement('canvas'); c.width=c.height=64; const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(.22,'rgba(255,255,255,.55)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
const GLOW = glowTex();

/* ---------------- ground ---------------- */
function groundH(x,z){ const d=Math.hypot(x,z); const h=(Math.sin(x*.13)+Math.cos(z*.11))*.6+Math.sin(x*.37+z*.29)*.3; return h*THREE.MathUtils.smoothstep(d,9,30); }
{
  const g = new THREE.PlaneGeometry(320,320,110,110); g.rotateX(-Math.PI/2);
  const p=g.attributes.position, cols=[], c=new THREE.Color();
  for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i); p.setY(i, groundH(x,z));
    c.setHSL(.26+R(-.03,.04), .42+R(0,.12), .11+R(0,.06)); cols.push(c.r,c.g,c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols,3)); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors:true, flatShading:true, roughness:1})));
}

const occluders = [];
const UP = new V3(0,1,0);
function limb(a,b,r0,r1,m=barkMat){
  const d=new V3().subVectors(b,a), len=d.length();
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r1,r0,len,7,1), m);
  mesh.position.copy(a).addScaledVector(d,.5); mesh.quaternion.setFromUnitVectors(UP,d.normalize());
  scene.add(mesh); occluders.push(mesh);
  const j=new THREE.Mesh(new THREE.IcosahedronGeometry(r1*1.05,0), m); j.position.copy(b); scene.add(j);
  return mesh;
}

/* ---------------- the great tree ---------------- */
const TRUNK_H = 36;
{
  const g = new THREE.CylinderGeometry(.85, 2.3, TRUNK_H, 18, 36);
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i), y=p.getY(i), z=p.getZ(i), r=Math.hypot(x,z); if(r<.01) continue;
    const a=Math.atan2(z,x), n=1+.09*Math.sin(a*5+y*.4)+.05*Math.sin(a*11-y*.9), na=a+y*.03;
    p.setXYZ(i, Math.cos(na)*r*n, y, Math.sin(na)*r*n); }
  g.computeVertexNormals();
  const trunk = new THREE.Mesh(g, barkMat); trunk.position.y = TRUNK_H/2; scene.add(trunk); occluders.push(trunk);
}

/* hotspots: a glowing core inside the Primary Goal double ring */
const hotspots = [];
const ringGeo = new Map();
function hotspot(pos, L, i, size=.55){
  const color = LEVELS[L].color, base = new THREE.Color(color);
  const m = new THREE.Group(); m.position.copy(pos);
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(size*.5,2), new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:2.4, roughness:.3}));
  m.add(core);
  if(!ringGeo.has(size)) ringGeo.set(size, new THREE.TorusGeometry(size*1.05, size*.07, 8, 56));
  const ringMat = new THREE.MeshBasicMaterial({color:base.clone().multiplyScalar(2.2)});
  const mark = new THREE.Group(); m.add(mark);
  [-1,1].forEach(sx=>{ const r=new THREE.Mesh(ringGeo.get(size), ringMat); r.position.x = sx*size*.525; mark.add(r); });
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW, color, transparent:true, opacity:.45, blending:THREE.AdditiveBlending, depthWrite:false}));
  halo.scale.setScalar(size*4.4); m.add(halo);
  const hit = new THREE.Mesh(new THREE.SphereGeometry(size*2,8,6), new THREE.MeshBasicMaterial({visible:false})); m.add(hit);
  hit.userData.owner = m;
  m.userData = {L, i, size, halo, hit, s:1, core, mark, ringMat, base};
  scene.add(m); hotspots.push(m);
  LEVELS[L].items[i].pos = pos.clone();
  return m;
}

/* 1. ROOTS: eight buttress roots */
function rootFin(L,H){ const s=new THREE.Shape(); s.moveTo(0,0); s.lineTo(L,0); s.quadraticCurveTo(L*.3,H*.22,0,H); s.lineTo(0,0);
  const g=new THREE.ExtrudeGeometry(s,{depth:.42,bevelEnabled:true,bevelThickness:.12,bevelSize:.12,bevelSegments:1,curveSegments:12}); g.translate(0,0,-.21); return g; }
const ROOT_OFF = Math.PI/4 - Math.PI/8;
for(let i=0;i<8;i++){
  const a = ROOT_OFF + i/8*Math.PI*2, Lr = 6.2+R(-.4,.4);
  const fin = new THREE.Mesh(rootFin(Lr, 5.2+R(-.5,.6)), barkMat);
  fin.rotation.y = -a; fin.position.set(Math.cos(a)*1.3, -.15, Math.sin(a)*1.3);
  scene.add(fin); occluders.push(fin);
  const r = 1.3+Lr+.9, x=Math.cos(a)*r, z=Math.sin(a)*r;
  hotspot(new V3(x, groundH(x,z)+.85, z), 0, i, .5);
  // small surface root between fins
  const b = a + Math.PI/8, l2 = R(2.5,3.6);
  const sm = new THREE.Mesh(rootFin(l2, 1.6), barkDark); sm.rotation.y=-b; sm.position.set(Math.cos(b)*1.6,-.1,Math.sin(b)*1.6); scene.add(sm);
}

/* 2. FOREST FLOOR: the trail */

const trail = new THREE.CatmullRomCurve3(trailPts);
{
  const N = Math.floor(trail.getLength()/1.05);

  add(new THREE.SphereGeometry(.32,8,6), red, [0,0,0], [1,1,1], [0,0,0], head);

  add(new THREE.ConeGeometry(.13,.34,6), beak, [0,-.08,.36], [1,1,1], [Math.PI/2+.7,0,0], head);
  add(new THREE.SphereGeometry(.045,6,4), blk, [.14,.08,.22], [1,1,1], [0,0,0], head);
  add(new THREE.SphereGeometry(.045,6,4), blk, [-.14,.08,.22], [1,1,1], [0,0,0], head);
  const wings=[-1,1].map(sx=>{ const w=new THREE.Group(); w.position.set(sx*.33,.85,-.02); g.add(w);
    add(new THREE.SphereGeometry(.3,7,5), yel, [sx*.08,-.15,0], [.35,.8,.7], [0,0,0], w);

}

        <div class="chips">${L.items.map((x,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===sel}" title="${x.t}">${chipText(cur,i)}</button>`).join('')}</div>
        ${it ? `<div class="more"><b>${it.t}</b>${it.q?`<div class="q">${it.q}</div>`:''}<div class="d">${it.d}</div></div>`
             : L.callout ? `<div class="more"><div class="x"><b>${L.callout[0]}</b> ${L.callout[1]}</div></div>` : ''}
        ${progBar()}`;
      card.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.i; i===sel? go(cur) : pick(cur,i); }));
    }
    card.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.go)));
    rail.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-current', String(+b.dataset.l===cur)));
    card.classList.remove('swap'); layout();
  };
  clearTimeout(swapT);
  if(animate && !REDUCED){ card.classList.add('swap'); swapT=setTimeout(draw,220); } else draw();
}

function go(l){
  const changed = l!==cur || sel>=0;
  cur=l; sel=-1;
  controls.autoRotate = l<0 && !REDUCED;
  flyTo(l<0?OVERVIEW:VIEWS[l]);
  renderCard(changed);
  const h = l<0 ? '' : LEVELS[l].id;
  if(!auto && location.hash.slice(1)!==h){ try{ history.replaceState(null,'',h?'#'+h:location.pathname+location.search); }catch(e){} }
}
function pick(L,i){
  const lvl = L!==cur; cur=L; sel=i; controls.autoRotate=false;
  flyTo(itemView(L, LEVELS[L].items[i].pos), 1.4);
  renderCard(lvl);
}
addEventListener('hashchange',()=>{ if(location.hash==='#tour'){ kiosk=true; enter(); if(!auto) startAuto(); return; } const l=LEVELS.findIndex(L=>L.id===location.hash.slice(1)); if(l!==cur) go(l); });
addEventListener('keydown',e=>{
  if(!$('#intro').classList.contains('gone')) return;
  if(e.key==='ArrowRight'||e.key==='ArrowUp'){ e.preventDefault(); go(cur<4?cur+1:-1); }
  else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){ e.preventDefault(); go(cur>-1?cur-1:4); }
  else if(e.key==='Escape') go(-1);
});
const enter=()=>{ $('#intro').classList.add('gone'); document.body.classList.remove('intro'); };
$('#start').addEventListener('click',()=>{ enter(); go(-1); });
$('#play').addEventListener('click',()=>{ enter(); startAuto(); });

/* ---------------- auto tour ----------------
   Overview, then each layer and each item in turn, looping forever.
   Any touch, drag, click or key pauses it. Open the page with #tour to start it
   straight away (for screens at events); in that mode it resumes after 45s idle. */
let auto=null, kiosk=false, lastInput=performance.now();
const TOUR_STEPS=[{l:-1,i:-1,d:6}];
LEVELS.forEach((L,l)=>{ TOUR_STEPS.push({l,i:-1,d:7}); L.items.forEach((_,i)=>TOUR_STEPS.push({l,i,d:4.6})); });
function progBar(){ return auto ? `<div class="prog"><span style="animation-duration:${auto.dur-.25}s"></span></div>` : ''; }
const PLAY='<svg viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z"/></svg>', PAUSE='<svg viewBox="0 0 12 12"><path d="M2.5 1.5h2.5v9H2.5zM7 1.5h2.5v9H7z"/></svg>';
function tourBtn(){ const b=$('#tour'); b.setAttribute('aria-pressed',String(!!auto)); b.querySelector('.ic').innerHTML=auto?PAUSE:PLAY; b.querySelector('.tx').textContent=auto?'Pause tour':'Play tour'; }
function startAuto(){ auto={idx:-1,next:0,dur:0}; hideHint(); tourBtn(); advance(); }
function stopAuto(){ if(!auto) return; auto=null; tourBtn(); controls.autoRotate=false; card.querySelector('.prog')?.remove(); }
function advance(){ auto.idx=(auto.idx+1)%TOUR_STEPS.length; const st=TOUR_STEPS[auto.idx];
  auto.dur=st.d+1.8; auto.next=performance.now()+auto.dur*1000;
  st.i<0 ? go(st.l) : pick(st.l,st.i); }
$('#tour').addEventListener('click',()=>{ lastInput=performance.now(); auto? stopAuto() : startAuto(); });
const userInput=()=>{ lastInput=performance.now(); stopAuto(); };
[card,rail,labelsEl].forEach(el=>el.addEventListener('pointerdown',userInput));
renderer.domElement.addEventListener('pointerdown',userInput);
renderer.domElement.addEventListener('wheel',userInput,{passive:true});
addEventListener('keydown',userInput,true);
const hideHint=()=>$('.hint').classList.add('gone');
setTimeout(hideHint, 14000);

let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3200); }
const SQUAWKS=['Every loop of the canopy vine reaches a little further.','Design from the target backwards.','Protect the live time.','Roots first, fruit later.'];
let sq=0;

/* picking */
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
const hitTargets=[...hotspots.map(m=>m.userData.hit), macawHit];
let hover=null, down=null;
function pickAt(e){ const r=renderer.domElement.getBoundingClientRect(); ptr.set((e.clientX-r.left)/r.width*2-1, -(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(ptr,camera); const h=ray.intersectObjects(hitTargets,false)[0]; return h? (h.object===macawHit?'macaw':h.object.userData.owner) : null; }
renderer.domElement.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse') return; const h=pickAt(e); if(hover && hover!=='macaw') hover.userData.el.classList.remove('peek'); hover=h; if(h && h!=='macaw') h.userData.el.classList.add('peek'); renderer.domElement.style.cursor=h?'pointer':''; });
renderer.domElement.addEventListener('pointerdown',e=>{ down=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointerup',e=>{ if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6) return; const h=pickAt(e); if(!h) return;
  if(h==='macaw'){ if(!flight) flight={start:clock.elapsedTime}; toast(SQUAWKS[sq++%SQUAWKS.length]); return; }
  pick(h.userData.L,h.userData.i); });
controls.addEventListener('start',()=>{ controls.autoRotate=false; tween=null; hideHint(); });

/* keep the scene centred in the space the card leaves free (eased, so it never jumps) */
const off={x:0,y:0,tx:0,ty:0};
function layout(){ const w=innerWidth, h=innerHeight;
  if(isNarrow()){ off.tx=0; off.ty=Math.round(card.offsetHeight*.42); }
  else { off.tx=-Math.round((card.offsetWidth+30)*.32); off.ty=Math.round(Math.max(0,card.offsetHeight-h*.35)*.3); } }
function resize(){ const w=innerWidth,h=innerHeight; camera.aspect=w/h; renderer.setSize(w,h); composer.setSize(w,h); bloom.resolution.set(w,h); layout(); applyOffset(true); }
function applyOffset(force){ const nx=off.x+(off.tx-off.x)*.08, ny=off.y+(off.ty-off.y)*.08;
  if(!force && Math.abs(nx-off.x)<.05 && Math.abs(ny-off.y)<.05) return; off.x=nx; off.y=ny;
  camera.setViewOffset(innerWidth,innerHeight,off.x,off.y,innerWidth,innerHeight); camera.updateProjectionMatrix(); }
addEventListener('resize',resize);
new ResizeObserver(layout).observe(card);

/* ---------------- loop ---------------- */
const clock=new THREE.Clock();
const tmp=new V3(), tmp2=new V3(), dirV=new V3();
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(auto && performance.now()>auto.next) advance();
  if(kiosk && !auto && performance.now()-lastInput>45000) startAuto();
  if(auto){ controls.autoRotate=!tween && !REDUCED; controls.autoRotateSpeed=.22; } else controls.autoRotateSpeed=.35;
  if(tween){ const k=Math.min(1,(performance.now()-tween.start)/tween.dur), e=ease(k);
    camera.position.lerpVectors(tween.p0,tween.p1,e); camera.position.y += Math.sin(Math.PI*k)*tween.arc;
    controls.target.lerpVectors(tween.t0,tween.t1,e); if(k>=1) tween=null; }
  controls.update();
  applyOffset();

  hotspots.forEach((m,n)=>{ const u=m.userData, isCur=u.L===cur, lit=cur<0||isCur, active=isCur&&u.i===sel, hov=hover===m;
    const goal=(1+.05*Math.sin(t*2+n))*(hov?1.25:1)*(active?1.3:1)*(lit?1:.7);
    u.s+=(goal-u.s)*Math.min(1,dt*7); m.scale.setScalar(u.s);
    u.mark.quaternion.copy(camera.quaternion);
    if(active) u.mark.rotateZ(t*.8);
    const g=u.L===4?.55:1; u.ringMat.color.copy(u.base).multiplyScalar(lit ? (active? 3.2 : 2.2)*g : .55);
    u.core.material.emissiveIntensity = (lit ? 2.4 : .5)*(u.L===4?.45:1);
    u.halo.material.opacity = lit ? .45 : .12; });
  crownCore.rotation.y += dt*.3;
  pulses.forEach(s=>{ s.position.copy(ring.getPoint((t*.045+s.userData.o)%1)); s.position.y+=.26; });
  shafts.forEach(s=>s.material.opacity=.035+.02*Math.sin(t*.4+s.userData.ph));

  const fp=ffGeo.attributes.position.array;
  for(let i=0;i<FF;i++){ const p=ffPh[i]; fp[i*3]=ffBase[i*3]+Math.sin(t*.3+p)*.9; fp[i*3+1]=ffBase[i*3+1]+Math.sin(t*.5+p*1.3)*.6; fp[i*3+2]=ffBase[i*3+2]+Math.cos(t*.27+p)*.9; }
  ffGeo.attributes.position.needsUpdate=true;
  fireflies.material.opacity=.75+.25*Math.sin(t*1.7);

  butterflies.forEach(b=>{ const u=b.userData, a=t*u.sp+u.ph, r=u.rad+2*Math.sin(t*.7+u.ph);
    b.position.set(Math.cos(a)*r, u.y+1.2*Math.sin(t*1.3+u.ph), Math.sin(a)*r);
    const a2=a+.05*Math.sign(u.sp); tmp.set(Math.cos(a2)*r, b.position.y, Math.sin(a2)*r); b.lookAt(tmp);
    const f=Math.sin(t*16+u.ph)*1.1; u.L.rotation.z=f; u.Rw.rotation.z=-f; });

  const {head,wings}=macaw.userData;
  if(flight){ const u=Math.min(1,(t-flight.start)/7), a=perchA+u*Math.PI*2, r=RING_R+(14-RING_R)*Math.sin(Math.PI*u), y=perchP.y+3.5*Math.sin(Math.PI*u);
    macaw.position.set(Math.cos(a)*r,y,Math.sin(a)*r);
    const a2=a+.05; tmp2.set(Math.cos(a2)*(r+.01), y, Math.sin(a2)*(r+.01)); dirV.subVectors(tmp2,macaw.position);
    macaw.rotation.set(-.5*Math.sin(Math.PI*u), Math.atan2(dirV.x,dirV.z), 0);
    const f=Math.sin(t*16)*.9; wings[0].rotation.z=-f; wings[1].rotation.z=f;
    if(u>=1){ flight=null; macaw.position.copy(perchP); macaw.rotation.set(0,Math.PI/2-perchA,0); wings.forEach(w=>w.rotation.z=0); } }
  else { head.rotation.y=Math.sin(t*.8)*.5; head.rotation.x=Math.sin(t*1.3)*.1; }

  composer.render();
  updateLabels();
  requestAnimationFrame(frame);
}

const occRay=new THREE.Raycaster();
let occFrame=0;
function updateLabels(){
  const w=innerWidth, h=innerHeight, introOpen=!$('#intro').classList.contains('gone'); occFrame++;
  hotspots.forEach(m=>{ const u=m.userData, el=u.el, on=u.L===cur && !introOpen;
    el.classList.toggle('on',on); el.classList.toggle('active',on&&u.i===sel);
    if(!on && !el.classList.contains('peek')) return;
    tmp.copy(m.position).project(camera);
    if(tmp.z>1||Math.abs(tmp.x)>1.2||Math.abs(tmp.y)>1.2){ el.style.visibility='hidden'; return; } el.style.visibility='';
    el.style.transform=`translate(${(tmp.x+1)/2*w - 12}px,${(1-tmp.y)/2*h - 12}px) translate(26px,-26px)`;
    if(on && occFrame%6===0){ const d=camera.position.distanceTo(m.position); dirV.subVectors(m.position,camera.position).normalize(); occRay.set(camera.position,dirV); occRay.far=d-.8;
      el.classList.toggle('behind', occRay.intersectObjects(occluders,false).length>0); } });
  signs.forEach((el,l)=>{ const on=cur<0 && !introOpen; el.classList.toggle('on',on); if(!on) return;
    tmp.copy(SIGN_POS[l]).project(camera); if(tmp.z>1){ el.style.visibility='hidden'; return; } el.style.visibility='';
    const x=(tmp.x+1)/2*w, y=(1-tmp.y)/2*h; el.style.transform=`translate(${x+(l===1?10:36)}px,${y}px) translate(0,-50%)`; });
}

renderCard(false); resize();
tourBtn();
if(location.hash==='#tour'){ kiosk=true; enter(); startAuto(); }
const startL = LEVELS.findIndex(L=>L.id===location.hash.slice(1));
if(startL>=0){ $('#intro').classList.add('gone'); document.body.classList.remove('intro'); go(startL); }
requestAnimationFrame(()=>{ frame(); setTimeout(()=>$('#loader').classList.add('gone'),250); });
</script>
</body>
